name: Sync Upstream Skills

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 6am UTC
  workflow_dispatch: {} # Manual trigger from Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run upstream sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/sync-upstream.sh
          # sync-upstream.sh exits 1 when no changes — don't fail the job
          bash scripts/sync-upstream.sh || SYNC_EXIT=$?
          if [[ "${SYNC_EXIT:-0}" -eq 1 ]]; then
            echo "no_changes=true" >> "$GITHUB_ENV"
          elif [[ "${SYNC_EXIT:-0}" -eq 0 ]]; then
            echo "no_changes=false" >> "$GITHUB_ENV"
          else
            exit "$SYNC_EXIT"
          fi

      - name: Create PR if changes found
        if: env.no_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="upstream-sync/$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add upstream/
          git commit -m "chore: sync upstream skill sources $(date +%Y-%m-%d)"
          git push -u origin "$BRANCH" --force
          gh pr create \
            --title "chore: upstream skill sync $(date +%Y-%m-%d)" \
            --body "$(cat <<'EOF'
          ## Upstream Skill Sync

          Weekly sync of upstream skill/rule sources into `upstream/`.

          **Sources** (from `sources.json`):
          - `trailofbits/skills` — static analysis, insecure defaults, supply chain
          - `agamm/claude-code-owasp` — OWASP Top 10:2025, ASVS 5.0
          - `yoanbernabeu/supabase-pentest-skills` — Supabase RLS, auth, RPC
          - `callstackincubator/agent-skills` — React Native performance
          - `hookdeck/webhook-skills` — webhook signature patterns

          Review the diff in `upstream/` to see what changed, then decide whether to update the corresponding skills in `skills/`.

          🤖 Generated by sync-upstream-skills workflow
          EOF
          )"
